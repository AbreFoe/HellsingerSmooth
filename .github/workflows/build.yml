name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download BepInEx (reference libraries only)
        run: |
          curl -sSL -o bepinex.zip https://github.com/BepInEx/BepInEx/releases/download/v6.0.0-pre.2/BepInEx-Unity.IL2CPP-win-x64-6.0.0-pre.2.zip
          mkdir -p lib && unzip -q bepinex.zip 'BepInEx/core/*' -d lib
          # The archive keeps Windows attributes: folders come out without the execute bit and can't be opened
          chmod -R u+rwX lib

      - name: Build
        run: dotnet build src/HellsingerSmooth -c Release

      - name: Package plugin
        run: |
          mkdir -p out/BepInEx/plugins/HellsingerSmooth
          cp src/HellsingerSmooth/bin/Release/net6.0/HellsingerSmooth.dll out/BepInEx/plugins/HellsingerSmooth/

      - uses: actions/upload-artifact@v4
        with:
          name: HellsingerSmooth-plugin
          path: out/
